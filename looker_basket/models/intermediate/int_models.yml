version: 2

models:
  - name: int_total_orders
    description: "Calculates the total number of unique checkouts to use as the denominator for Support calculations."
    
  - name: int_item_frequencies
    description: "Calculates the absolute frequency of each category across all orders for Confidence calculations."
    columns:
      - name: category
        data_tests:
          - unique
          - not_null
      - name: category_frequency
        data_tests:
          - not_null

  - name: int_basket_summary
    description: "Aggregates the total items and revenue per individual basket."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: total_items
        data_tests:
          - not_null
      - name: basket_value
        data_tests:
          - not_null