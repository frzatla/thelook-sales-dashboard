version: 2

models:
  - name: fct_basket_pairs
    description: "Fact table containing all unique pairs of products purchased together in the same transaction."
    columns:
      - name: order_id
        description: "The identifier for the transaction where the product pair was purchased."
        data_tests:
          - not_null
      - name: product_a_name
        description: "The name of the first product in the basket pair."
        data_tests:
          - not_null
      - name: product_a_category
        description: "The category of the first product."
      - name: product_b_name
        description: "The name of the second product in the basket pair."
        data_tests:
          - not_null
      - name: product_b_category
        description: "The category of the second product."