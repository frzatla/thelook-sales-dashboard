version: 2

models:
  - name: fct_basket_pairs
    description: "Fact table containing all unique pairs of products purchased together in the same transaction."
    columns:
      - name: order_id
        description: "The identifier for the transaction where the product pair was purchased."
        data_tests:
          - not_null
      - name: product_a_name
        description: "The name of the first product in the basket pair."
        data_tests:
          - not_null
      - name: product_a_category
        description: "The category of the first product."
      - name: product_b_name
        description: "The name of the second product in the basket pair."
        data_tests:
          - not_null
      - name: product_b_category
        description: "The category of the second product."
        
  - name: fct_association_rules
    description: "Contains directed association rules with calculated Support and Confidence percentages."
    columns:
      - name: base_category
        description: "The primary category selected or filtered by the user."
      - name: associated_category
        description: "The category purchased alongside the base category."
      - name: times_bought_together
      - name: support_pct
        description: "Percentage of total orders containing this specific pair."
      - name: confidence_pct
        description: "Probability that the associated category is bought given the base category is in the basket."

  - name: fct_baskets
    description: "Transaction-level aggregation for calculating total order values and basket sizes."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: total_items
      - name: basket_value
  
  - name: fct_sales
    description: "Core fact table unifying order items, products, and users to calculate item-level profitability and append regional data."
    columns:
      - name: order_item_id
        description: "Primary key for the individual order item."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier for the checkout transaction."
        data_tests:
          - not_null
      - name: user_id
        description: "Identifier for the purchasing user."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier for the specific product purchased."
        data_tests:
          - not_null
      - name: order_created_at
        description: "Timestamp indicating when the order was placed."
      - name: sale_price
        description: "The revenue generated from the item sale."
      - name: cost
        description: "The base cost of the item."
      - name: gross_profit
        description: "The calculated margin (sale_price - cost) for the item."
      - name: category
        description: "The overarching product category."
      - name: country
        description: "Country where the user is located."
      - name: state
        description: "State or province where the user is located."
      - name: city
        description: "City where the user is located."
      - name: latitude
        description: "Latitude coordinate for geographic mapping."
      - name: longitude
        description: "Longitude coordinate for geographic mapping."