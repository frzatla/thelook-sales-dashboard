version: 2

# No loaded_at_field configs due to the the nature of both datasets being static.
sources:
  - name: thelook_ecommerce
    description: "Public e-commerce dataset containing orders, users, and events."
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: orders
        description: "Contains details including order status, created_at timestamps, and user IDs."
      - name: order_items
        description: "Contains details for orders, including product IDs and sale prices."

  - name: raw_marketing
    description: "Custom synthetic marketing dataset generated for campaign performance analysis."
    database: firzas-e-commerce-project
    schema: raw_marketing
    tables:
      - name: ad_spend
        description: "Daily ad spend, impressions, and clicks per marketing campaign and channel from 2024 to 2026."