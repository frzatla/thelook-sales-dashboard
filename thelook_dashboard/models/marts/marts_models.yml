version: 2

models:
  - name: fct_sales
    description: "Core fact table unifying order items, products, and users to calculate item-level profitability and append regional data."
    columns:
      - name: order_item_id
        description: "Primary key for the individual order item."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier for the checkout transaction."
        data_tests:
          - not_null
      - name: user_id
        description: "Identifier for the purchasing user."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier for the specific product purchased."
        data_tests:
          - not_null
      - name: order_created_at
        description: "Timestamp indicating when the order was placed."
      - name: sale_price
        description: "The revenue generated from the item sale."
      - name: cost
        description: "The base cost of the item."
      - name: gross_profit
        description: "The calculated margin (sale_price - cost) for the item."
      - name: category
        description: "The overarching product category."
      - name: country
        description: "Country where the user is located."
      - name: state
        description: "State or province where the user is located."
      - name: city
        description: "City where the user is located."
      - name: latitude
        description: "Latitude coordinate for geographic mapping."
      - name: longitude
        description: "Longitude coordinate for geographic mapping."
      - name: traffic_source
        description: "Source/medium of the user."
  
  - name: agg_monthly_financials
    description: "Monthly aggregated financial and sales metrics at the category and geographic level."
    columns:
      - name: order_month
        description: "The truncated month and year the orders were placed."
        data_tests:
          - not_null
      - name: category
        description: "The high-level product category."
      - name: country
        description: "The country where the order was placed."
      - name: state
        description: "The state or province where the order was placed."
      - name: quantity_sold
        description: "Total count of individual items purchased."
        data_tests:
          - not_null
      - name: total_sales
        description: "Total revenue generated from the items."
      - name: total_gross_profit
        description: "Total gross profit calculated from total sales minus total costs."