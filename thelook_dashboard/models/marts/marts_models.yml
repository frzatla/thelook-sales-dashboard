version: 2

models:
  - name: fct_sales
    description: "Core fact table unifying order items, products, and users to calculate item-level profitability and append regional data."
    columns:
      - name: order_item_id
        description: "Primary key for the individual order item."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier for the checkout transaction."
        data_tests:
          - not_null
      - name: user_id
        description: "Identifier for the purchasing user."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier for the specific product purchased."
        data_tests:
          - not_null
      - name: order_created_at
        description: "Timestamp indicating when the order was placed."
      - name: sale_price
        description: "The revenue generated from the item sale."
      - name: cost
        description: "The base cost of the item."
      - name: gross_profit
        description: "The calculated margin (sale_price - cost) for the item."
      - name: category
        description: "The overarching product category."
      - name: country
        description: "Country where the user is located."
      - name: state
        description: "State or province where the user is located."
      - name: city
        description: "City where the user is located."
      - name: latitude
        description: "Latitude coordinate for geographic mapping."
      - name: longitude
        description: "Longitude coordinate for geographic mapping."
      - name: traffic_source
        description: "Source/medium of the user."
  
  - name: agg_monthly_financials
    description: "Monthly aggregated financial and sales metrics at the category and geographic level."
    columns:
      - name: order_month
        description: "The truncated month and year the orders were placed."
        data_tests:
          - not_null
      - name: category
        description: "The high-level product category."
      - name: country
        description: "The country where the order was placed."
      - name: state
        description: "The state or province where the order was placed."
      - name: quantity_sold
        description: "Total count of individual items purchased."
        data_tests:
          - not_null
      - name: total_sales
        description: "Total revenue generated from the items."
      - name: total_gross_profit
        description: "Total gross profit calculated from total sales minus total costs."

  - name: fct_obt
    description: "One big table combining order item, product, and user attributes at order-item grain, including unfiltered order status and customer type."
    columns:
      - name: order_item_id
        description: "Unique identifier for each order line item."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier for the order this item belongs to."
        data_tests:
          - not_null
      - name: user_id
        description: "Identifier for the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: product_id
        description: "Identifier for the product sold."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: status
        description: "Order item status, unfiltered (includes Cancelled and Returned)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Cancelled', 'Returned']
      - name: order_created_at
        description: "Timestamp the order item was created."
        data_tests:
          - not_null
      - name: sale_price
        description: "Sale price of the item."
        data_tests:
          - not_null
      - name: cost
        description: "Product cost, from stg_products."
      - name: gross_profit
        description: "Sale price minus cost. Null if cost is unavailable."
      - name: category
        description: "Product category."
      - name: brand
        description: "Product brand."
      - name: product_name
        description: "Product name."
      - name: country
        description: "Customer country."
      - name: state
        description: "Customer state."
      - name: city
        description: "Customer city."
      - name: latitude
        description: "Customer latitude."
      - name: longitude
        description: "Customer longitude."
      - name: traffic_source
        description: "Acquisition traffic source for the customer."
      - name: customer_type
        description: "New if this order was the customer's first order (by order_rank), otherwise Returning."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New', 'Returning']