version: 2

models:
  - name: stg_order_items
    description: "Staging model for cart-level data. Acts as the base for basket definition."
    columns:
      - name: order_item_id
        description: "Primary key for the individual cart item."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier for the checkout transaction (the 'basket')."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier for the specific product purchased."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: user_id
        description: "Primary key for the user account."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id 
      - name: sale_price
        description: "The actual price the customer paid for this item."
        data_tests:
          - not_null
      - name: status
        description: "Status of the order."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Cancelled', 'Returned']

  - name: stg_products
    description: "Staging model for product metadata mapping numerical IDs to human-readable names."
    columns:
      - name: product_id
        description: "Primary key for the product."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "The actual title/name of the product."
        data_tests:
          - not_null
      - name: category
        description: "The specific category of the product (e.g., Activewear, Outerwear)."
      - name: department
        description: "The high-level department (e.g., Men, Women)."
      - name: brand
        description: "Name of the brand of the product"
        data_tests:
          - not_null
      - name: cost 
        description: "Cost of the product."
        
  - name: stg_users
    description: "Staging model for user geographic and account creation metadata."
    columns:
      - name: user_id
        description: "Primary key for the user account."
        data_tests:
          - unique
          - not_null
      - name: state
        description: "State or province where the user resides."
      - name: city
        description: "City where the user resides."
      - name: country
        description: "Country where the user resides."
      - name: latitude
        description: "Latitude coordinate of the user's location for mapping."
      - name: longitude
        description: "Longitude coordinate of the user's location for mapping."
      - name: user_created_at
        description: "Timestamp of when the user registered their account."
      - name: traffic_source
        description: "Source/medium of the user."
  
  - name: stg_events
    description: "Staging model for raw event data tracking user page views, clicks, and checkout progression."
    columns:
      - name: event_id
        description: "Primary key for the individual event."
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "Identifier for the user who triggered the event. Can be null for anonymous browsers."
      - name: session_id
        description: "Identifier grouping a continuous browsing session."
        data_tests:
          - not_null
      - name: created_at
        description: "Timestamp of when the event occurred."
        data_tests:
          - not_null
      - name: event_type
        description: "The specific action taken (e.g., Home, Department, Product, Cart, Purchase, Cancel)."
        data_tests:
          - not_null